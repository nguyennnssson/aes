name: ESP32 Firmware Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build esp32-cam firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Provision CI-only MQTT trust anchor
        shell: bash
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=AES CI MQTT CA" \
            -keyout "$RUNNER_TEMP/aes-ci-mqtt-ca.key" \
            -out esp32-cam/main/srv_cert.crt

      - name: Build firmware with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.2
          target: esp32
          path: esp32-cam
