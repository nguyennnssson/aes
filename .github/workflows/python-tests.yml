name: Python Pipeline Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pipeline-tests:
    name: Run pipeline test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.lock

      - name: Audit Python dependency lock
        run: pip-audit -r requirements.lock

      - name: Run unit tests
        run: pytest tests/ -q

      - name: Install and start mosquitto broker
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          cat > mosquitto-ci.conf <<'EOF'
          listener 1883 127.0.0.1
          allow_anonymous true
          EOF
          mosquitto -c mosquitto-ci.conf -d
          sleep 2

      - name: Run pipeline tests
        env:
          AES_INSECURE_DEV_MQTT: "1"
        run: python scripts/test_pipeline.py

  web-security:
    name: Web build and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build
