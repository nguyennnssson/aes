rules:
  - id: esp32-cwe119-buffer-overflow
    pattern-either:
      - pattern: strcpy($DEST, $SRC)
      - pattern: strcat($DEST, $SRC)
      - pattern: gets($DEST)
      - pattern: sprintf($DEST, ...)
      - pattern: vsprintf($DEST, ...)
    message: "CRITICAL: Detected unsafe 'strcpy' (CWE-119). Potential buffer overflow on ESP32 flash! Use 'strlcpy' or 'strncpy' instead."
    languages: [c]
    severity: ERROR

  - id: esp32-cwe416-use-after-free
    patterns:
      - pattern: free($PTR);
      - pattern-not: |
          free($PTR);
          ...
          $PTR = NULL;
    message: "WARNING: Detected potential Use-After-Free (CWE-416). Object accessed after free() without nullifying pointer."
    languages: [c]
    severity: ERROR

  - id: esp32-cwe78-command-injection
    pattern-either:
      - pattern: system($CMD)
      - pattern: popen($CMD, ...)
    message: "CRITICAL: Detected unsafe 'system' call (CWE-78). Remote command injection risk on gateway interface!"
    languages: [c]
    severity: ERROR

  - id: esp32-cwe134-nonliteral-format
    patterns:
      - pattern-either:
          - pattern: printf($FORMAT, ...)
          - pattern: ESP_LOGI($TAG, $FORMAT, ...)
          - pattern: ESP_LOGW($TAG, $FORMAT, ...)
          - pattern: ESP_LOGE($TAG, $FORMAT, ...)
      - metavariable-regex:
          metavariable: $FORMAT
          regex: '^[A-Za-z_][A-Za-z0-9_]*$'
    message: "Non-literal format string may permit memory disclosure or corruption (CWE-134)."
    languages: [c]
    severity: ERROR

  - id: esp32-cwe190-unchecked-allocation
    patterns:
      - pattern: $PTR = malloc($SIZE);
      - pattern-not-inside: |
          $PTR = malloc($SIZE);
          ...
          if ($PTR == NULL) { ... }
    message: "Heap allocation result is not checked before use."
    languages: [c]
    severity: WARNING

  - id: esp32-private-key-material
    pattern-regex: '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'
    message: "Private key material must never be embedded in firmware source."
    languages: [c]
    severity: ERROR

  - id: esp32-cwe798-hardcoded-credentials
    pattern-either:
      - pattern-regex: '(?i)(password|passwd|secret|wifi_pass)\s*=\s*".+"'
      - pattern-regex: '(?i)#define\s+\w*(PASS|PASSWD|PASSWORD|SECRET|KEY|TOKEN)\w*\s+".+"'
    message: "CRITICAL: Hardcoded credentials detected (CWE-798). WiFi passwords or private keys must not be stored in plain text source!"
    languages: [c]
    severity: ERROR
