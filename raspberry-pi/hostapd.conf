interface=ap0
driver=nl80211
ssid=AES-Gateway
hw_mode=g
channel=6
wmm_enabled=0
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
# SECURITY: never commit a real passphrase. This file ships a placeholder; set
# the real passphrase on the Pi only, where the file is deployed but not tracked:
#   sudo sed -i "s/__SET_ON_PI__/<strong-passphrase>/" /etc/hostapd/hostapd.conf
# NOTE: the previous demo passphrase was rotated out of git history — if it was
# ever used on real hardware, change it on the device.
wpa_passphrase=__SET_ON_PI__
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
